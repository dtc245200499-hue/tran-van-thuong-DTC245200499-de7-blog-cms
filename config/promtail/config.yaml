server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /positions/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: nginx-access
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          stream: access
          project: dtc245200499
          __path__: /logs/nginx/access.log
    pipeline_stages:
      - json:
          expressions: {time: time}
      - timestamp: {source: time, format: RFC3339}
  - job_name: nginx-error
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          stream: error
          project: dtc245200499
          __path__: /logs/nginx/error.log
