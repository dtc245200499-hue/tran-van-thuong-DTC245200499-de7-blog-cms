log_format blog_json escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
server {
  listen 8080;
  server_name localhost;
  server_tokens off;
  client_max_body_size 20m;
  access_log /var/log/blog/access.log blog_json;
  error_log /var/log/blog/error.log warn;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location = /xmlrpc.php { return 403; }
  location ~ /\. { deny all; }
  location / {
    proxy_pass http://wordpress:80;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
  }
}
server {
  listen 8081;
  server_name _;
  access_log off;
  location = /stub_status { stub_status; }
  location / { return 404; }
}
