name: dtc245200499-blog
x-defaults: &defaults
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
x-wp-env: &wp-env
  WORDPRESS_DB_HOST: mysql:3306
  WORDPRESS_DB_NAME: blog
  WORDPRESS_DB_USER: blog
  WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
  WORDPRESS_CONFIG_EXTRA: |
    define('DISALLOW_FILE_EDIT', true);
    define('DISALLOW_FILE_MODS', true);
    define('WP_ENVIRONMENT_TYPE', 'local');
    define('WP_DEBUG', false);
services:
  init-logs:
    image: busybox:1.37.0
    user: "0:0"
    restart: "no"
    command: ["sh", "-c", "chown 101:101 /logs && chmod 0755 /logs"]
    volumes: [nginx_logs:/logs]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: ["no-new-privileges:true"]
  mysql:
    <<: *defaults
    image: mysql:8.4.4
    environment:
      MYSQL_DATABASE: blog
      MYSQL_USER: blog
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password, exporter_password]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mysql/init-exporter.sh:/docker-entrypoint-initdb.d/10-exporter.sh:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$(cat /run/secrets/db_password)" mysql -h 127.0.0.1 -u blog blog -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 1g
  wordpress:
    <<: *defaults
    image: wordpress:6.8.1-php8.3-apache
    environment: *wp-env
    secrets: [db_password]
    depends_on:
      mysql: {condition: service_healthy}
    volumes:
      - wordpress_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/campus-journal:ro
      - ./config/php/hardening.ini:/usr/local/etc/php/conf.d/hardening.ini:ro
    networks: [frontend, database]
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\",80)?0:1);'"]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 512m
  seed:
    image: wordpress:cli-2.12.0-php8.3
    profiles: [tools]
    user: "33:33"
    environment:
      <<: *wp-env
      HOME: /tmp
      BLOG_URL: http://localhost:8080
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    secrets: [db_password, wp_admin_password, wp_editor_password]
    volumes:
      - wordpress_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/campus-journal:ro
      - ./scripts/seed.sh:/seed.sh:ro
    entrypoint: ["/bin/sh", "/seed.sh"]
    depends_on:
      wordpress: {condition: service_healthy}
    networks: [database]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  nginx:
    <<: *defaults
    image: nginxinc/nginx-unprivileged:1.28.0-alpine
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/blog
    depends_on:
      wordpress: {condition: service_healthy}
      init-logs: {condition: service_completed_successfully}
    networks: [frontend, monitoring]
  phpmyadmin:
    <<: *defaults
    image: phpmyadmin:5.2.2-apache
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 32M
    ports: ["127.0.0.1:8081:80"]
    depends_on:
      mysql: {condition: service_healthy}
    networks: [database, admin]
  nginx-exporter:
    <<: *defaults
    image: nginx/nginx-prometheus-exporter:1.4.2
    user: "65534:65534"
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    read_only: true
    cap_drop: [ALL]
    depends_on: [nginx]
    networks: [monitoring]
  mysql-exporter:
    <<: *defaults
    image: prom/mysqld-exporter:v0.17.2
    user: "65534:65534"
    command: ["--config.my-cnf=/run/secrets/exporter_cnf"]
    secrets: [exporter_cnf]
    read_only: true
    cap_drop: [ALL]
    depends_on:
      mysql: {condition: service_healthy}
    networks: [database, monitoring]
  cadvisor:
    <<: *defaults
    image: ghcr.io/google/cadvisor:0.55.1
    privileged: true
    command: ["--docker_only=true", "--housekeeping_interval=15s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [monitoring]
  prometheus:
    <<: *defaults
    image: prom/prometheus:v3.3.0
    user: "65534:65534"
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    read_only: true
    cap_drop: [ALL]
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [monitoring]
  grafana:
    <<: *defaults
    image: grafana/grafana:11.6.0
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    secrets: [grafana_password]
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring]
  loki:
    <<: *defaults
    image: grafana/loki:3.4.2
    user: "10001:10001"
    command: ["-config.file=/etc/loki/config.yaml"]
    read_only: true
    cap_drop: [ALL]
    volumes:
      - ./config/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks: [monitoring]
  promtail:
    <<: *defaults
    image: grafana/promtail:3.4.2
    user: "0:0"
    command: ["-config.file=/etc/promtail/config.yaml"]
    read_only: true
    cap_drop: [ALL]
    volumes:
      - ./config/promtail/config.yaml:/etc/promtail/config.yaml:ro
      - nginx_logs:/logs/nginx:ro
      - promtail_positions:/positions
    depends_on: [loki]
    networks: [monitoring]
networks:
  frontend: {}
  database: {internal: true}
  monitoring: {internal: true}
  admin: {}
volumes:
  mysql_data: {}
  wordpress_data: {}
  nginx_logs: {}
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
  promtail_positions: {}
secrets:
  db_password: {file: ./secrets/db_password.txt}
  db_root_password: {file: ./secrets/db_root_password.txt}
  exporter_password: {file: ./secrets/exporter_password.txt}
  exporter_cnf: {file: ./secrets/exporter.cnf}
  wp_admin_password: {file: ./secrets/wp_admin_password.txt}
  wp_editor_password: {file: ./secrets/wp_editor_password.txt}
  grafana_password: {file: ./secrets/grafana_password.txt}
